[project]
name = "askwri"
version = "0.1.0"
description = "AskWRI: answers and briefings from WRI publications, with a citation for every claim."
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=2.4.0",
    "boto3>=1.43.123",
    # Layout-aware PDF to Markdown (the former pymupdf4llm). AGPL-3.0; see issue #2.
    "opentelemetry-api>=1.30",
    "psycopg[binary]>=3.2",
    "pymupdf==2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
# Everything the AgentCore Runtime zip needs: the package script installs exactly this group,
# so PyMuPDF stays out.
agent = [
    "anthropic[bedrock]>=2.4.0",
    "bedrock-agentcore>=1.25.3",
    "boto3>=1.43.123",
]

[tool.uv]
package = false
default-groups = ["dev", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# PyMuPDF's SWIG bindings warn on import under Python 3.12; nothing to act on.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
